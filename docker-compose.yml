version: '3.8'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./site:/app/site
      - ./backend/email_config.json:/app/backend/email_config.json
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend_data: